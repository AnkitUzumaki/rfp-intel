[project]
name = "rfp-intel"
version = "0.1.0"
description = "RFP Intelligence Platform: hybrid RAG search engine + multi-agent extraction"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "qdrant-client[fastembed]>=1.12",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "streamlit>=1.35",
    "rapidocr-onnxruntime>=1.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "types-PyYAML"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# BLE (blind except) not selected: never-raise ingestion/agent boundaries catch broadly on purpose
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["B008"]  # typer.Option/Argument defaults are the Typer idiom

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
