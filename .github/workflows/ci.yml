name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.27"
          python-version: "3.10"   # minimum supported version (PDF §9)
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ hashFiles('config/settings.yaml') }}
      - run: uv sync --frozen
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint + types
        run: |
          uv run ruff check .
          uv run mypy ingestion search agents api settings.py
      - name: Tests (no LLM key needed, agents use a scripted fake LLM)
        run: uv run pytest -q --cov=ingestion --cov=search --cov=agents --cov=api --cov-report=term
      - name: Retrieval evaluation (gate)
        run: |
          uv run python main.py eval
          uv run python -m eval.check_gate --metric recall@5 --config hybrid+expand+rerank --min 0.85
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: eval/report.md

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
